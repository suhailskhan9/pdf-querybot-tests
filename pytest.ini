[pytest]
testpaths = tests
addopts = -ra --strict-markers --browser chromium -m "not e2e"
markers =
    api: HTTP-level tests against the FastAPI backend
    ui: Playwright browser tests (backend mocked)
    slow: tests that call the real Gemini model (use quota)
    e2e: full browser-to-real-backend test (skipped by default)
    eval: reserved for answer-quality evaluation tests